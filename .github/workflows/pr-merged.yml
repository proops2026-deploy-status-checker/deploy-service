name: PR Merged — App CI + Push
on:
  push:
    branches: [master]
jobs:
  app-ci:
    uses: proops2026-deploy-status-checker/proops2026-cicd-platform/.github/workflows/reusable-app-ci.yml@v1
    with:
      image-name: tert62/dsc-deploy-service
      image-tag: ${{ github.sha }}
      prepare-script: prisma:generate
      postgres-image: postgres:16 # throwaway DB: PostgreSQL integration tests run instead of skipping
      migrate-script: prisma:migrate
      test-script: test:coverage
      push-image: true # master = push tert62/dsc-deploy-service:<full sha>
    secrets:
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
