name: Merge → Build + Deploy Dev
on:
  push:
    branches: [master]
jobs:
  app-ci: # job name kept: ruleset checks are "app-ci / lint|test|audit|build-image"
    uses: proops2026-deploy-status-checker/proops2026-cicd-platform/.github/workflows/reusable-build.yml@v2
    with:
      image-name: tert62/dsc-deploy-service
      image-tag: ${{ github.sha }}
      prepare-script: prisma:generate
      postgres-image: postgres:16 # throwaway DB: PostgreSQL integration tests run instead of skipping
      migrate-script: prisma:migrate
      test-script: test:coverage
      push-image: true # master = push tert62/dsc-deploy-service:<sha> once; every env promotes this tag
    secrets:
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  deploy-dev:
    needs: app-ci
    if: needs.app-ci.outputs.image-tag != '' # empty = nothing pushed (iac-only change) -> no deploy
    uses: proops2026-deploy-status-checker/proops2026-cicd-platform/.github/workflows/reusable-deploy.yml@v2
    with:
      environment: dev
      image-name: tert62/dsc-deploy-service
      image-tag: ${{ needs.app-ci.outputs.image-tag }}
      service-name: deploy-service
      app-secret-keys: DATABASE_URL REDIS_URL
      runs-on: '["self-hosted", "duc-local"]' # own runner + own minikube, independent of Tien's cluster
    secrets: inherit # env secrets resolve only inside the job that declares environment: dev
