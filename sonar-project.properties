# SonarCloud project configuration for deploy-service.
# The scanner reads this file automatically from the repo root.

# --- Identity (must match the SonarCloud project exactly) ---
sonar.projectKey=proops2026-deploy-status-checker_deploy-service
sonar.organization=proops2026-deploy-status-checker

# --- What to analyze ---
# Production source: scanned for bugs / vulnerabilities / code smells.
sonar.sources=src
# Test code: kept separate so findings here are classified as test, not production.
sonar.tests=test

# --- What to skip ---
# Build output, dependencies and the coverage report dir are not our source.
sonar.exclusions=dist/**,node_modules/**,coverage/**

# --- Coverage ---
# Path to the lcov report the test job produces via c8 (see package.json "test:coverage").
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
